; Ground msposd (moving map). msposd reads this next to its binary.
; Same place and size as pcpilot's map, so the goggles and the PC match.
[map]
enabled = 1
show_on_start = 1
; packs from msposd's mspmaptool; the first one in the folder if this is missing
mbtiles = /root/maps/OpenTopoMap.mbtiles
corner = bottom-right
width = 26%
height = 28%
margin = 24
follow = plane
zoom = 15
