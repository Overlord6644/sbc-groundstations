; Ground msposd (moving map). msposd reads this next to its binary.
; Same place and size as pcpilot's map, so the goggles and the PC match.
[map]
enabled = 1
; shown at start, and the live show/hide the goggles menu flips (msposd_map.sh)
show_on_start = 1
; packs copied from pcpilot (map_sync.sh) or made with mspmaptool; the first one
; in the folder when this one is missing
mbtiles = /root/maps/swisstopo.mbtiles
layout = corner
corner = bottom-right
width = 26%
height = 28%
margin = 24
follow = plane
zoom = 15
opacity = 100
