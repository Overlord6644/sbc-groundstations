gsmenu:
  enabled: true
  # Eachine Sphere Link VRX button map. Same RK3566 base as the RunCam
  # WiFiLink, but the buttons are wired to different lines and polarities, so
  # the standard six-key layout does not fit:
  #   - the 5-way RIGHT is on PIN40 (gpiochip3 line 5), active-low and with no
  #     external pull, so it needs bias:pull-up + active_low:true;
  #   - the dedicated AP button (PIN38) toggles the WiFi hotspot instead of
  #     doubling as Enter;
  #   - there is a dedicated REC button, so long-press-left must NOT toggle
  #     recording (long_action: "").
  # These extra keys require the input.cpp support in PixelPilot_rk.
  gpio:
    up: 16
    down: 18
    center: 11
    # REC is an action, not the built-in DVR toggle: in gadget mode the DVR
    # partition is exported as USB mass-storage (recording on the VRX would
    # corrupt it), so recording is done PC-side; the script no-ops with a
    # message in gadget mode and toggles the local DVR (SIGUSR1) on HDMI.
    rec:   { chip: gpiochip3, pin: 18, action: "/usr/bin/rec-toggle.sh" }
    left:  { chip: gpiochip3, pin: 2, long_action: "" }
    # RIGHT is on gpiochip3/5 and reads active-HIGH (0 idle -> 1 pressed),
    # like up/down/center - NOT active-low. The earlier bias:pull-up +
    # active_low made the stable-0 line read as a permanent press (phantom
    # continuous-right). Plain input is correct on this unit.
    right: { chip: gpiochip3, pin: 5 }
    ap:    { chip: gpiochip3, pin: 6, action: "sh -c '[ -e /etc/wpa_supplicant.hotspot.conf ] && gsmenu.sh set gs wifi hotspot off || gsmenu.sh set gs wifi hotspot on'" }

  actions:
    ground:
      - label: Toggle gadget mode
        action: /usr/sbin/gadget
      - label: Generate support package
        action: /usr/bin/collect_support_data.sh

# In gadget mode PixelPilot keeps running on HDMI and restreams the raw
# RTP to the PC (pcpilot) over the USB link, so both the VRX screen and the
# PC get video. Harmless "no client" when no PC is attached.
restream:
  enabled: true
  manual_ip: 192.168.5.100
