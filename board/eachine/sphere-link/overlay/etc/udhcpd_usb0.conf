# USB gadget DHCP (Eachine board override of the common file).
#
# The PC's NCM MAC is fixed by the gadget (host_addr 48:6f:73:74:50:43), so
# it always gets 192.168.5.100 - the address PixelPilot restreams to and
# pcpilot expects. Any other host still gets an address from the pool.
#
# Long lease: the common 10 s lease made Windows drop and re-acquire its
# address every ~30 s, and every drop cut the restreamed video.
#
# No router at all: with one, Windows routed the PC's internet through the
# VRX (lower metric than its Wi-Fi). The camera is not routed either - the
# image has no NAT - the PC reaches it through cam_proxy.sh on 192.168.5.1.
interface usb0
start 192.168.5.100
end 192.168.5.110
max_leases 10
static_lease 48:6f:73:74:50:43 192.168.5.100
opt subnet 255.255.255.0
opt lease 86400
